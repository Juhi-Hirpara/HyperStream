<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperStream Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="subscriptions">
<div class="page-shell page-shell-inner">
    <nav class="site-nav compact-nav">
        <a class="brand-link" href="/">HyperStream</a>
        <div class="nav-links">
            <a href="/" data-nav="home">Home</a>
            <a href="/movies.html" data-nav="movies">Movies</a>
            <a href="/users.html" data-nav="users">Users</a>
            <a href="/subscriptions.html" data-nav="subscriptions">Plans</a>
            <a href="/watchlist.html" data-nav="watchlist">Watchlist</a>
        </div>
    </nav>

    <main class="main-content">
        <section class="section-header">
            <div>
                <p class="eyebrow">Plans Route</p>
                <h2>Subscription CRUD</h2>
            </div>
            <div class="header-metric">Total <strong id="subscription-page-count">0</strong></div>
        </section>
        <div id="status-banner" class="status-banner">Loading subscriptions...</div>
        <section class="panel-layout">
            <aside class="form-panel">
                <div class="panel-title-row"><h3>Subscription Form</h3><button class="ghost-btn small" type="button" id="reset-subscription-form">New</button></div>
                <form id="subscription-form" class="stack-form">
                    <label><span>Plan Name</span><input id="subscription-plan-name" type="text" required></label>
                    <div class="form-grid">
                        <label><span>Price</span><input id="subscription-price" type="number" min="0" step="0.01" required></label>
                        <label><span>Duration In Days</span><input id="subscription-duration" type="number" min="1" required></label>
                    </div>
                    <label class="toggle-row"><input id="subscription-active" type="checkbox" checked><span>Plan is active</span></label>
                    <button class="primary-btn form-submit" type="submit">Save Plan</button>
                </form>
            </aside>
            <div class="content-panel">
                <div class="toolbar toolbar-end">
                    <select id="subscription-page-size" class="page-size-select">
                        <option value="30">30 per page</option>
                        <option value="50">50 per page</option>
                        <option value="100">100 per page</option>
                    </select>
                </div>
                <div id="subscriptions-grid" class="pricing-grid"></div>
                <div id="subscriptions-pagination"></div>
            </div>
        </section>
    </main>
</div>
<script src="/app.js"></script>
</body>
</html>
